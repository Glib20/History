<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Віртуальна екскурсія будинком міського жителя</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Intro -->
  <div id="intro" class="screen active">
    <div class="intro-content">
      <h1>🏠 Віртуальна екскурсія</h1>
      <h2>Будинком міського жителя</h2>
      <p>Ласкаво просимо до типової міської квартири!<br>
      Познайомтеся з кімнатами та цікавими фактами.</p>
      <button id="start-btn" class="btn primary">Почати екскурсію</button>
    </div>
  </div>

  <!-- Tour -->
  <div id="tour" class="screen">
    <header class="top-bar">
      <div class="logo">Міська квартира</div>
      <div class="room-title" id="room-title">Передпокій</div>
      <button id="menu-btn" class="btn small">Меню кімнат</button>
    </header>

    <main class="room-container">
      <div id="room-view" class="room-view"></div>
      <aside class="info-panel">
        <h3 id="info-title">Передпокій</h3>
        <p id="info-text"></p>
        <div class="facts" id="facts"></div>
      </aside>
    </main>

    <nav class="nav-bar">
      <button id="prev-btn" class="btn nav">← Попередня</button>
      <div class="dots" id="dots"></div>
      <button id="next-btn" class="btn nav">Наступна →</button>
    </nav>
  </div>

  <!-- Menu modal -->
  <div id="room-menu" class="modal">
    <div class="modal-content">
      <h3>Оберіть кімнату</h3>
      <div class="room-list" id="room-list"></div>
      <button id="close-menu" class="btn">Закрити</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
